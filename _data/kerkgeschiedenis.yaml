    titel: Church history
    beschrijving: A simplified main line of church history, from the early church to today’s Dutch denominations.
    intro: How did the churches in the Netherlands come about? This page shows the main line, from the early church through the Reformation to today’s Protestant denominations.
    disclaimer: This visual shows a simplified main line. It is not exhaustive and makes no theological value judgement.
    legendaTitel: How to read the diagram
    legendaDirect: "Solid line: direct institutional line or merger"
    legendaInvloed: "Dotted line: influence or kinship"
    legendaExtern: "Box with ↗: existing denomination, links to its own website"
