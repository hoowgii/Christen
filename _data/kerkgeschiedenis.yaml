    titel: Kerkgeschiedenis
    beschrijving: Een vereenvoudigde hoofdlijn van de kerkgeschiedenis, van de vroege kerk tot de Nederlandse kerkverbanden van nu.
    intro: Hoe zijn de kerken in Nederland ontstaan? Deze pagina laat de hoofdlijn zien, van de vroege kerk via de Reformatie tot de protestantse kerkverbanden van nu.
    disclaimer: Deze visual toont een vereenvoudigde hoofdlijn. Zij is niet uitputtend en spreekt geen theologisch waardeoordeel uit.
    legendaTitel: Zo lees je de tekening
    legendaDirect: "Doorgetrokken lijn: directe institutionele lijn of samenvoeging"
    legendaInvloed: "Stippellijn: invloed of verwantschap"
