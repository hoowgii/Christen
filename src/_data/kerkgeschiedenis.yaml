# Vereenvoudigde kerkgeschiedenis – data voor /kerkgeschiedenis/ en /en/church-history/
#
# knopen:  kolom (0 = links) en rij (0 = boven) bepalen de plek in de tekening op grote schermen.
#          'label' en 'sub' staan in het blokje; 'naam' en 'omschrijving' in de tekstlijst eronder.
#          'url' = externe website (bestaand kerkverband), 'link' = interne pagina op Christen&.
#          Zonder url of link verwijst het blokje naar de uitleg in de tekstlijst.
# lijnen:  soort 'direct'    = doorgetrokken lijn: institutionele overgang, voortzetting of kerkvereniging
#          soort 'aftakking' = onderbroken lijn: afscheiding, niet meegaan of vorming van een nieuw kerkverband
#          soort 'invloed'   = fijne stippellijn: invloed, verwantschap of gedeelde traditie
#          Optioneel: 'knik' = x-positie van de verticale knik, 'route: onder' = via de onderkant,
#          'pad' = vaste punten [[x,y], ...] voor lijnen die om andere blokjes heen moeten,
#          'label' / 'label_en' met 'lx', 'ly' = korte toelichting bij de lijn.

tekening:
  kolomBreedte: 160
  rijHoogte: 100
  marge: 80
  knoopBreedte: 124
  knoopHoogte: 58
  breedte: 1290
  hoogte: 720

tekst:
  nl:
    titel: Kerkgeschiedenis
    beschrijving: Een vereenvoudigde hoofdlijn van de kerkgeschiedenis, van de vroege kerk tot de Nederlandse kerkverbanden van nu.
    intro: Hoe zijn de kerken in Nederland ontstaan? Deze pagina laat de hoofdlijn zien, van de vroege kerk via de Reformatie tot de protestantse kerkverbanden van nu.
    disclaimer: Deze visual toont een vereenvoudigde hoofdlijn. Zij is niet uitputtend en spreekt geen theologisch waardeoordeel uit.
    legendaTitel: Zo lees je de tekening
    legendaDirect: "Doorgetrokken lijn: institutionele overgang, voortzetting of kerkvereniging"
    legendaAftakking: "Onderbroken lijn: afscheiding, niet meegaan of vorming van een nieuw kerkverband"
    legendaInvloed: "Fijne stippellijn: invloed, verwantschap of gedeelde traditie"
    legendaExtern: "Blokje met ↗: bestaand kerkverband, linkt naar de eigen website"
    tekeningLabel: Tekening van de vereenvoudigde kerkgeschiedenis
    rkDoorloop: De rooms-katholieke traditie loopt door tot vandaag
    lijstTitel: De hoofdlijn in tekst
    direct: "Voortzetting of vereniging vanuit:"
    aftakking: "Afgesplitst of niet meegegaan vanuit:"
    invloed: "Invloed, verwantschap of traditie:"
    website: Website
    meer: Meer op Christen&
    extern: (externe website, opent in nieuw tabblad)
  en:
    titel: Church history
    beschrijving: A simplified main line of church history, from the early church to today’s Dutch denominations.
    intro: How did the churches in the Netherlands come about? This page shows the main line, from the early church through the Reformation to today’s Protestant denominations.
    disclaimer: This visual shows a simplified main line. It is not exhaustive and makes no theological value judgement.
    legendaTitel: How to read the diagram
    legendaDirect: "Solid line: institutional transition, continuation or church union"
    legendaAftakking: "Dashed line: secession, not joining, or formation of a new denomination"
    legendaInvloed: "Fine dotted line: influence, kinship or shared tradition"
    legendaExtern: "Box with ↗: existing denomination, links to its own website"
    tekeningLabel: Diagram of the simplified church history
    rkDoorloop: The Roman Catholic tradition continues to this day
    lijstTitel: The main line as text
    direct: "Continuation or union from:"
    aftakking: "Separated or did not join from:"
    invloed: "Influence, kinship or tradition:"
    website: Website
    meer: More on Christen&
    extern: (external website, opens in a new tab)

knopen:
  - id: vroege-kerk
    kolom: 0
    rij: 0
    label: Vroege kerk
    label_en: Early church
    sub: eerste eeuwen
    sub_en: first centuries
    naam: Vroege kerk
    naam_en: Early church
    omschrijving: De christelijke kerk in de eerste eeuwen na Christus.
    omschrijving_en: The Christian church in the first centuries after Christ.

  - id: westerse-kerk
    kolom: 1
    rij: 0
    label: Westerse kerk
    label_en: Western church
    sub: rooms-katholiek
    sub_en: Roman Catholic
    naam: Westerse kerk / rooms-katholieke traditie
    naam_en: Western church / Roman Catholic tradition
    omschrijving: De kerk in West-Europa onder leiding van de bisschop van Rome. Deze rooms-katholieke traditie loopt tot vandaag door.
    omschrijving_en: The church in Western Europe under the leadership of the bishop of Rome. This Roman Catholic tradition continues to this day.

  - id: reformatie
    kolom: 1
    rij: 1
    label: Reformatie
    label_en: Reformation
    sub: 16e eeuw
    sub_en: 16th century
    naam: Reformatie
    naam_en: Reformation
    jaar: 16e eeuw
    jaar_en: 16th century
    omschrijving: Hervormingsbeweging binnen de westerse kerk in de zestiende eeuw. Zij leidde tot de vorming van protestantse kerken buiten de rooms-katholieke kerk.
    omschrijving_en: Reform movement within the Western church in the sixteenth century. It led to the formation of Protestant churches outside the Roman Catholic Church.
    link: /onderwerp/reformatie/
    link_en: /en/topic/reformation/

  - id: luther
    kolom: 2
    rij: 1
    label: Luther
    label_en: Luther
    sub: "1517"
    naam: Maarten Luther en de lutherse traditie
    naam_en: Martin Luther and the Lutheran tradition
    jaar: "1517"
    omschrijving: Maarten Luther publiceerde in 1517 zijn 95 stellingen. Uit zijn werk ontstond de lutherse traditie.
    omschrijving_en: Martin Luther published his 95 theses in 1517. His work gave rise to the Lutheran tradition.
    link: /lezen/reformatoren/
    link_en: /en/reading/reformers/

  - id: calvijn
    kolom: 2
    rij: 2
    label: Calvijn
    label_en: Calvin
    sub: vanaf 1536
    sub_en: from 1536
    naam: Johannes Calvijn en de gereformeerde traditie
    naam_en: John Calvin and the Reformed tradition
    jaar: vanaf 1536
    jaar_en: from 1536
    omschrijving: Johannes Calvijn publiceerde in 1536 de eerste uitgave van zijn Institutie. Hij is een van de grondleggers van de gereformeerde traditie.
    omschrijving_en: John Calvin published the first edition of his Institutes in 1536. He is one of the founders of the Reformed tradition.
    link: /onderwerp/calvijn/
    link_en: /en/topic/calvin/

  - id: ger-lijn
    kolom: 3
    rij: 2
    label: Ger./Herv. lijn
    label_en: Reformed line
    sub: in Nederland
    sub_en: in the Netherlands
    naam: Gereformeerde/hervormde lijn in Nederland
    naam_en: Reformed line in the Netherlands
    omschrijving: In Nederland kreeg de gereformeerde traditie vorm in de gereformeerde kerk, later de hervormde kerk genoemd.
    omschrijving_en: In the Netherlands the Reformed tradition took shape in the Reformed church, later known as the Hervormde (Dutch Reformed) church.

  - id: nhk
    kolom: 4
    rij: 2
    label: Ned. Herv. Kerk
    label_en: Dutch Ref. Church
    sub: "1816"
    naam: Nederlandse Hervormde Kerk
    naam_en: Dutch Reformed Church (Nederlandse Hervormde Kerk)
    jaar: "1816"
    omschrijving: In 1816 werd de kerk opnieuw georganiseerd als de Nederlandse Hervormde Kerk.
    omschrijving_en: In 1816 the church was reorganised as the Nederlandse Hervormde Kerk (Dutch Reformed Church).

  - id: afscheiding
    kolom: 4
    rij: 3
    label: Afscheiding
    label_en: Secession
    sub: "1834"
    naam: Afscheiding
    naam_en: Secession (Afscheiding)
    jaar: "1834"
    omschrijving: In 1834 scheidden gemeenten en leden zich af van de Nederlandse Hervormde Kerk. Een deel van de afgescheidenen vormde later de Gereformeerde Kerken onder het Kruis.
    omschrijving_en: In 1834 congregations and members seceded from the Dutch Reformed Church. Some of the seceders later formed the Gereformeerde Kerken onder het Kruis (Reformed Churches under the Cross).

  - id: cgk-1869
    kolom: 5
    rij: 3
    label: CGK
    label_en: CGK
    sub: "1869"
    naam: Christelijke Gereformeerde Kerk
    naam_en: Christian Reformed Church (Christelijke Gereformeerde Kerk)
    jaar: "1869"
    omschrijving: In 1869 verenigden de Christelijke Afgescheiden Gemeenten en de Gereformeerde Kerken onder het Kruis zich tot de Christelijke Gereformeerde Kerk.
    omschrijving_en: In 1869 the Christian Seceded Congregations and the Reformed Churches under the Cross united as the Christelijke Gereformeerde Kerk.

  - id: kruisgemeenten
    kolom: 5
    rij: 5
    label: Kruisgemeenten
    label_en: Kruisgemeenten
    sub: zelfstandig gebleven
    sub_en: independent
    naam: Zelfstandig gebleven kruisgemeenten
    naam_en: Independent ‘cross’ congregations (kruisgemeenten)
    omschrijving: Kruisgemeenten die in 1869 niet meegingen in de vereniging tot de Christelijke Gereformeerde Kerk en zelfstandig bleven.
    omschrijving_en: Congregations of the Churches under the Cross that did not join the 1869 union into the Christelijke Gereformeerde Kerk and remained independent.

  - id: ledeboerianen
    kolom: 5
    rij: 6
    label: Ledeboeriaanse
    label_en: Ledeboerian
    sub: gemeenten
    sub_en: congregations
    naam: Ledeboeriaanse gemeenten
    naam_en: Ledeboerian congregations
    omschrijving: Gemeenten die in de negentiende eeuw buiten de Nederlandse Hervormde Kerk ontstonden rond ds. L.G.C. Ledeboer.
    omschrijving_en: Congregations that arose outside the Dutch Reformed Church in the nineteenth century around Rev. L.G.C. Ledeboer.

  - id: doleantie
    kolom: 5
    rij: 4
    label: Doleantie
    label_en: Doleantie
    sub: "1886"
    naam: Doleantie
    naam_en: Doleantie
    jaar: "1886"
    omschrijving: In 1886 ging een tweede groep gemeenten en leden uit de Nederlandse Hervormde Kerk. Zij noemden zich de dolerende kerken.
    omschrijving_en: In 1886 a second group of congregations and members left the Dutch Reformed Church. They called themselves the ‘dolerende’ (grieving) churches.

  - id: gkn
    kolom: 6
    rij: 4
    label: GKN
    label_en: GKN
    sub: "1892"
    naam: Gereformeerde Kerken in Nederland
    naam_en: Reformed Churches in the Netherlands (Gereformeerde Kerken in Nederland)
    jaar: "1892"
    omschrijving: In 1892 verenigden vrijwel alle gemeenten van de Christelijke Gereformeerde Kerk en de dolerende kerken zich tot de Gereformeerde Kerken in Nederland.
    omschrijving_en: In 1892 almost all congregations of the Christelijke Gereformeerde Kerk and the dolerende churches united as the Gereformeerde Kerken in Nederland.

  - id: cgk
    kolom: 6
    rij: 3
    label: CGK
    label_en: CGK
    sub: vanaf 1892
    sub_en: from 1892
    naam: Christelijke Gereformeerde Kerken
    naam_en: Christian Reformed Churches (Christelijke Gereformeerde Kerken)
    jaar: vanaf 1892
    jaar_en: from 1892
    omschrijving: Een deel van de Christelijke Gereformeerde Kerk ging in 1892 niet mee in de vereniging en zette het kerkverband voort.
    omschrijving_en: Part of the Christelijke Gereformeerde Kerk did not join the 1892 union and continued the denomination.
    url: https://cgk.nl/

  - id: gg
    kolom: 6
    rij: 5
    label: Ger. Gemeenten
    label_en: Ger. Gemeenten
    sub: "1907"
    naam: Gereformeerde Gemeenten
    naam_en: Reformed Congregations (Gereformeerde Gemeenten)
    jaar: "1907"
    omschrijving: In 1907 verenigden de Ledeboeriaanse gemeenten en de zelfstandig gebleven kruisgemeenten zich tot de Gereformeerde Gemeenten.
    omschrijving_en: In 1907 the Ledeboerian congregations and the independent cross congregations united as the Gereformeerde Gemeenten.
    url: https://www.gergeminfo.nl/

  - id: elk
    kolom: 6
    rij: 1
    label: Ev.-Luth. Kerk
    label_en: Ev. Luth. Church
    sub: in Nederland
    sub_en: in the Netherlands
    naam: Evangelisch-Lutherse Kerk
    naam_en: Evangelical Lutheran Church (Evangelisch-Lutherse Kerk)
    omschrijving: De Evangelisch-Lutherse Kerk in het Koninkrijk der Nederlanden, de lutherse kerk in Nederland. Zij verenigde zich in 2004 met de Nederlandse Hervormde Kerk en de Gereformeerde Kerken in Nederland tot de Protestantse Kerk in Nederland.
    omschrijving_en: The Evangelical Lutheran Church in the Kingdom of the Netherlands, the Lutheran church in the Netherlands. In 2004 it united with the Dutch Reformed Church and the Gereformeerde Kerken in Nederland as the Protestant Church in the Netherlands.

  - id: pkn
    kolom: 7
    rij: 2
    label: PKN
    label_en: PKN
    sub: "2004"
    naam: Protestantse Kerk in Nederland
    naam_en: Protestant Church in the Netherlands (Protestantse Kerk in Nederland)
    jaar: "2004"
    omschrijving: Op 1 mei 2004 verenigden de Nederlandse Hervormde Kerk, de Gereformeerde Kerken in Nederland en de Evangelisch-Lutherse Kerk in het Koninkrijk der Nederlanden zich tot de Protestantse Kerk in Nederland. De PKN is institutioneel de voortzetting en rechtsopvolger van deze drie kerkgenootschappen. Niet alle gemeenten, ambtsdragers en leden konden in deze vereniging meegaan.
    omschrijving_en: On 1 May 2004 the Dutch Reformed Church, the Gereformeerde Kerken in Nederland and the Evangelical Lutheran Church in the Kingdom of the Netherlands united as the Protestant Church in the Netherlands. Institutionally, the PKN is the continuation and legal successor of these three churches. Not all congregations, office-bearers and members were able to join this union.
    url: https://protestantsekerk.nl/

  - id: hhk
    kolom: 7
    rij: 3
    label: HHK
    label_en: HHK
    sub: "2004"
    naam: Hersteld Hervormde Kerk
    naam_en: Restored Reformed Church (Hersteld Hervormde Kerk)
    jaar: "2004"
    omschrijving: Hervormde gemeenten, ambtsdragers en leden die vanwege principiële bezwaren niet meegingen in de vorming van de Protestantse Kerk in Nederland, vormden een nieuw kerkverband, de Hersteld Hervormde Kerk. De HHK heeft haar wortels in de Nederlandse Hervormde Kerk en beschouwt zichzelf historisch en confessioneel als voortzetting daarvan. Juridisch geldt de PKN als rechtsopvolger van de Nederlandse Hervormde Kerk.
    omschrijving_en: Hervormde congregations, office-bearers and members who, on grounds of principle, did not join the formation of the Protestant Church in the Netherlands formed a new denomination, the Hersteld Hervormde Kerk. The HHK has its roots in the Dutch Reformed Church and regards itself historically and confessionally as its continuation. Legally, the PKN is the successor of the Dutch Reformed Church.
    url: https://www.hersteldhervormdekerk.nl/

