naam: Verdiepen
naam_en: Going deeper
kort: Het geloof verantwoorden en de geloofsleer leren kennen.
kort_en: Giving reasons for the faith and learning its doctrine.
intro: Op zoek naar verdieping? Hier vind je twee wegen om verder te komen in het geloof, met bronnen die je daarbij helpen.
intro_en: Looking to go deeper? Here are two ways to grow in the faith, with resources to help you.
tekst: |
  ### Apologetiek
  Apologetiek is het verantwoorden van het christelijk geloof: uitleggen waarom christenen geloven wat ze geloven, en ingaan op vragen en kritiek. De Bijbel roept daartoe op: “Zijt altijd bereid tot verantwoording aan een iegelijk, die u rekenschap afvraagt van de hoop, die in u is” (1 Petrus 3:15).

  ### Catechismus
  Vragen over het geloof zijn niet nieuw. Daarom zijn er in de kerkgeschiedenis in verschillende landen vragen en antwoorden opgesteld over de kern van het geloof: een catechismus. In Nederland is de Heidelbergse Catechismus (1563) de bekendste. Op [heidelbergse-catechismus.nl](https://www.heidelbergse-catechismus.nl/) vind je de vragen en antwoorden, met een hedendaagse versie en bewijsteksten. In veel gemeenten wordt de catechismus in de middagdienst uitgelegd en bepreekt; zie [Verkondigd](/woord/verkondigd/).
tekst_en: |
  ### Apologetics
  Apologetics is giving reasons for the Christian faith: explaining why Christians believe what they believe, and responding to questions and criticism. The Bible calls us to this: “Be ready always to give an answer to every man that asketh you a reason of the hope that is in you” (1 Peter 3:15).

  ### Catechism
  Questions about faith are not new. That is why, over the history of the church, questions and answers on the heart of the faith were written in several countries: a catechism. In the Netherlands the best known is the Heidelberg Catechism (1563). On [heidelbergse-catechismus.nl](https://www.heidelbergse-catechismus.nl/) you can find its questions and answers, with a contemporary version and proof texts (in Dutch). In many congregations the catechism is explained and preached in the afternoon service; see [Preached](/en/word/preached/).

