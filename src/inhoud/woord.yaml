# & Woord – zie _LEESMIJ.md voor uitleg van de velden
volgorde: 1
slug: woord
slug_en: word
naam: Woord
naam_en: Word
kort: De Bijbel lezen en het Woord horen verkondigen.
kort_en: Reading the Bible and hearing the Word preached.
intro: Gods Woord staat in het midden. Hier vind je plaatsen om de Bijbel te lezen, met uitleg erbij, en plaatsen waar het Woord wordt verkondigd.
intro_en: God’s Word is central. Here you will find places to read the Bible, with explanation alongside, and places where the Word is preached.

sub:
  - slug: bijbel
    slug_en: bible
    naam: Bijbel
    naam_en: Bible
    kort: Online bijbellezen, met uitleg en kanttekeningen.
    kort_en: Read the Bible online, with explanation and notes.
    intro: Begin bij de bron. Lees de Bijbel online met uitleg erbij, of kies een bijbeluitgave om thuis zelf te bestuderen.
    intro_en: Start at the source. Read the Bible online with explanation, or choose a Bible edition to study at home.
  - slug: verkondigd
    slug_en: preached
    naam: Verkondigd
    naam_en: Preached
    kort: Kerkdiensten, preken en een kerk bij jou in de buurt.
    kort_en: Church services, sermons and a church near you.
    intro: Het Woord wordt verkondigd in de gemeente. Zoek een kerk bij jou in de buurt, of luister online naar preken.
    intro_en: The Word is preached in the congregation. Find a church near you, or listen to sermons online.
    tekst: |
      Op [Kerktijden.nl](https://www.kerktijden.nl/) zie je welke gemeenten in jouw woonplaats actief zijn en waar een bepaalde voorganger preekt.

      Veel gemeenten zenden hun diensten ook direct uit, via YouTube, [Kerkdienstgemist.nl](https://kerkdienstgemist.nl/) of [Kerkomroep.nl](https://kerkomroep.nl/). Het beste is om zelf een plaatselijke gemeente te bezoeken. Online preken kunnen een eerste stap zijn om door Gods Woord geraakt te worden, of een aanvulling als je zelf niet naar de kerk kunt.
    tekst_en: |
      On [Kerktijden.nl](https://www.kerktijden.nl/) you can see which congregations are active in your town and where a particular minister is preaching.

      Many congregations also broadcast their services live, via YouTube, [Kerkdienstgemist.nl](https://kerkdienstgemist.nl/) or [Kerkomroep.nl](https://kerkomroep.nl/). It is best to visit a local congregation yourself. Online sermons can be a first step towards being touched by God’s Word, or a supplement when you cannot go to church yourself.

