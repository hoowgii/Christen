volgorde: 2
slug: lezen
slug_en: reading
naam: Lezen
naam_en: Reading
kort: Boeken van christenen uit vroeger tijden, per stroming.
kort_en: Books by Christians from earlier centuries, by tradition.
intro: Christenen van vroeger schreven over geloof en leven met een diepgang die nog altijd helpt. De boeken zijn geordend naar tijd en stroming, met bij elk boek een korte toelichting.
intro_en: Christians of the past wrote about faith and life with a depth that still helps today. The books are arranged by period and tradition, each with a short introduction.

sub:
