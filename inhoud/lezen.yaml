    naam: Reformatoren
    naam_en: Reformers
    kort: Luther, Calvijn en tijdgenoten uit de zestiende eeuw.
    kort_en: Luther, Calvin and their contemporaries in the sixteenth century.
    intro: De Reformatie bracht de Bijbel terug in het midden van kerk en leven. Werken van de reformatoren zelf.
    intro_en: The Reformation brought the Bible back to the centre of church and life. Works by the Reformers themselves.
  - slug: puriteinen
    slug_en: puritans
    naam: Puriteinen
    naam_en: Puritans
    kort: Engelse schrijvers uit de zeventiende eeuw over het praktische geloofsleven.
    kort_en: Seventeenth-century English writers on practical Christian living.
    intro: De puriteinen schreven bevindelijk en praktisch over bekering, heiliging en het dagelijks leven met God.
    intro_en: The Puritans wrote experientially and practically about conversion, sanctification and daily life with God.
  - slug: nadere-reformatie
    slug_en: further-reformation
    naam: Nadere Reformatie
    naam_en: Further Reformation
    kort: Nederlandse schrijvers uit de zeventiende en achttiende eeuw.
    kort_en: Dutch writers from the seventeenth and eighteenth centuries.
    intro: De Nadere Reformatie wilde de Reformatie doortrekken naar het persoonlijk, gezins- en maatschappelijk leven.
    intro_en: The Dutch Further Reformation sought to carry the Reformation into personal, family and public life.

