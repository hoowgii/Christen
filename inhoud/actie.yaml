naam: Actie
naam_en: Action
kort: Omzien naar elkaar, dichtbij en ver weg.
kort_en: Caring for one another, near and far.
intro: Als christenen weten we ons verbonden met onze broeders en zusters, en zorgen we voor elkaar. Dat is een Bijbelse opdracht (Galaten 6:10).
intro_en: As Christians we know we are bound to our brothers and sisters, and we care for one another. That is a Biblical calling (Galatians 6:10).
tekst: |
  Veel scholen en ziekenhuizen in Europa zijn ontstaan vanuit dat omzien naar elkaar. Nog altijd wordt er op allerlei terreinen (extra) naar elkaar omgekeken, op heel verschillende manieren. Hieronder een greep.

  Ook dichtbij zijn er veel initiatieven: zendingsechtparen uit je eigen gemeente, de voedselbank, bezoekcommissies en meer. Vraag in je eigen gemeente waar je kunt helpen.
tekst_en: |
  Many schools and hospitals in Europe grew out of this care for one another. To this day people look out for each other in many areas and in very different ways. Here is a selection.

  There are also many initiatives close to home: missionary couples from your own congregation, the food bank, visiting committees and more. Ask in your own congregation where you can help.

